[Interface]
Address = ${INTERFACE}.1
ListenPort = 51820
PrivateKey = $(cat /config/server/privatekey-server)

# Block all forwarding into or out of the VPN tunnel.
PostUp = iptables -I FORWARD -i %i -j DROP; iptables -I FORWARD -o %i -j DROP

# Permit peers to reach only the tunnel IP on this container.
PostUp = iptables -I INPUT -i %i ! -d ${INTERFACE}.1 -j DROP

PostDown = iptables -D INPUT -i %i ! -d ${INTERFACE}.1 -j DROP; iptables -D FORWARD -o %i -j DROP; iptables -D FORWARD -i %i -j DROP
