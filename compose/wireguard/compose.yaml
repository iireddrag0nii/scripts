name: hbtech-wireguard

services:
  wireguard:
    image: lscr.io/linuxserver/wireguard@sha256:10db56ad834f94541307d5dfdbe87370e26d155bb341a5bf65789f970f24ab5c
    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago

      # Server configuration
      SERVERURL: "${WG_SERVER_URL:?WG_SERVER_URL is required}"
      SERVERPORT: "51821"
      PEERS: "1"
      INTERNAL_SUBNET: "10.77.77.0"
      PEERDNS: "1.1.1.1"
      ALLOWEDIPS: "10.77.77.1/32"

      # Never print private peer QR codes into logs
      LOG_CONFS: "false"

    ports:
      - "${WG_BIND_IP:?WG_BIND_IP is required}:51821:51820/udp"

    volumes:
      - wireguard_config:/config
      - ./server.conf:/config/templates/server.conf:ro
      - ./peer.conf:/config/templates/peer.conf:ro

    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"

volumes:
  wireguard_config:
